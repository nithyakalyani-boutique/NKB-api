services:
  postgres:
    image: postgres:17.6-alpine
    environment: { POSTGRES_DB: nkb, POSTGRES_USER: nkb, POSTGRES_PASSWORD: nkb_local }
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U nkb'], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7.4.6-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
volumes:
  postgres-data:
  redis-data:
